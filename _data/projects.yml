- title: "dsh-whale-galgame / Multi-Model Visual Novel Plugin"
  title_zh: "dsh-whale-galgame / 多模型视觉小说插件"
  category: games
  period: "2026-Present"
  period_zh: "2026—至今"
  role: "Creator and maintainer"
  role_zh: "创作者与维护者"
  area: "Agent harnesses, multi-model character systems, game intelligence"
  area_zh: "智能体运行框架、多模型角色系统、游戏智能"
  featured: true
  image: "/assets/img/covers/dsh-whale-galgame.jpg"
  image_alt: "dsh-whale-galgame running in DeepSeek Harness with a model character, relationship state, and reply choices"
  image_alt_zh: "在 DeepSeek Harness 中运行的 dsh-whale-galgame，展示模型角色、关系状态与回复选项"
  summary: "An open-source multi-model visual novel plugin for DeepSeek Harness. It turns bounded cross-session task cues into character interactions across six model personas, while separating character presentation from reply-model routing and preserving per-character relationship state, dialogue, side stories, and optional CGs."
  summary_zh: "面向 DeepSeek Harness 的开源多模型视觉小说插件。它将限定范围内的跨会话任务线索转化为六个模型人格的角色互动，将角色呈现与回复模型路由分离，并保留各角色的关系状态、对话、支线故事与可选 CG 插画。"
  links:
    - label: "GitHub"
      label_zh: "GitHub"
      url: "https://github.com/JAdpp/dsh-whale-galgame/tree/main"

