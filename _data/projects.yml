- title: "Where Did This Cat Come From? (哪来的猫)"
  title_zh: "哪来的猫"
  category: games
  period: "2026"
  role: "Creator and developer"
  role_zh: "创作者与开发者"
  area: "Pixel-art roguelite / Godot prototype / Chinese-language UI"
  area_zh: "像素风轻度 Roguelike / Godot 原型 / 中文界面"
  image: "/assets/img/covers/where-did-this-cat-come-from-title.png"
  image_rendering: pixelated
  image_alt: "The pixel-art title screen for Where Did This Cat Come From?, with its Chinese logo above an orange stray cat on a rainy city street"
  image_alt_zh: "《哪来的猫》的像素风标题画面：中文标志下方，一只橘色流浪猫站在雨中的城市街道上"
  summary: "A side-scrolling stray-cat roguelite across connected streets, rooftops, and sewers. Meow, carry one item at a time, and rescue other animals while finding surreal second chances through a pet-prison escape and an underworld chase."
  summary_zh: "一款以流浪猫为主角的横版轻度 Roguelike，穿行于相互连通的街道、屋顶与下水道。通过喵叫、单件物品携带和动物救援展开探索，并在宠物监狱逃脱与冥界追逐中寻找超现实的重来机会。"
