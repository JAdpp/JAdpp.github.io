  image_alt_zh: "《RESIDENT EVIL: OUTBREAK NIGHT》概念海报，非游戏实机画面：幸存者携带解药箱穿过雪街，屋顶有追逐者，前方是医院"
  summary: "Carry an antidote through a snowbound street and reach the hospital while watching for rooftop pursuers. A fan game inspired by the Resident Evil films, presented as an unofficial, work-in-progress survival-horror prototype. Not affiliated with or endorsed by Resident Evil or its rights holders. The cover is concept artwork, not gameplay. Desktop browser, keyboard and mouse, and WebGL 2 required; first load is approximately 73 MB."
  summary_zh: "携带解药穿过积雪街道，在屋顶追逐者的威胁下抵达医院。基于《生化危机》电影的同人游戏创作，目前为开发中的生存恐怖 Prototype。非官方作品，与《生化危机》及其权利方无隶属、合作或背书关系。封面为概念宣传图，非游戏实机画面。需电脑浏览器、键盘鼠标与 WebGL 2，首次加载约 73 MB。"
  links:
    - label: "Prototype"
      label_zh: "Prototype"
