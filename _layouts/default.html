<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("ymzhang-theme");
          if (savedTheme === "dark" || savedTheme === "light") {
            document.documentElement.dataset.theme = savedTheme;
          }
        } catch (_) {
          // Local storage may be unavailable in privacy-restricted contexts.
        }
      })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main" class="page-shell">
      {{ content }}
    </main>
    <div class="image-lightbox" data-lightbox hidden aria-hidden="true">
      <div class="image-lightbox__backdrop" data-lightbox-close></div>
      <div class="image-lightbox__dialog" role="dialog" aria-modal="true" aria-labelledby="lightbox-caption">
        <button class="image-lightbox__close" type="button" data-lightbox-close aria-label="Close enlarged image">
          <span aria-hidden="true">&#215;</span>
          <span class="visually-hidden">Close enlarged image</span>
        </button>
        <figure class="image-lightbox__figure">
          <img data-lightbox-image alt="" decoding="async">
          <figcaption id="lightbox-caption" data-lightbox-caption></figcaption>
        </figure>
      </div>
    </div>
    {% include footer.html %}
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
