{% assign thumbnail = site.data.image_thumbnails[include.image] %}
{% if thumbnail %}
  {% assign preview = thumbnail.preview %}
  {% if include.compact %}{% assign preview = thumbnail.variants | first %}{% endif %}
  <img{% if include.class %} class="{{ include.class }}"{% endif %} src="{{ preview.path | relative_url }}" srcset="{% for variant in thumbnail.variants %}{{ variant.path | relative_url }} {{ variant.width }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ include.sizes }}" width="{{ thumbnail.width }}" height="{{ thumbnail.height }}" alt="{{ include.alt | escape }}" loading="lazy" decoding="async">
{% else %}
  <img{% if include.class %} class="{{ include.class }}"{% endif %} src="{{ include.image | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy" decoding="async">
{% endif %}
